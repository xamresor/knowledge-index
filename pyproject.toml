[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-index"
dynamic = ["version"]
description = "GraphRAG for code: a read-only knowledge layer over related code projects: one cross-repo code graph plus on-device doc search, exposed to agents (MCP), scripts (HTTP) and a human (static dashboard)."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"          # tomllib, used for the config and the alias table
authors = [{ name = "Romans Sereda" }]
keywords = ["code-graph", "knowledge-base", "mcp", "rag", "search", "graphify", "qmd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]

# No runtime Python dependencies — standard library only, on purpose: the tool has to run where
# installing packages is not an option. Its two real dependencies are external CLIs that no Python
# package manager can deliver (`graphify` via uv/pipx, `qmd` via npm); `kb-install` checks for them.
dependencies = []

[project.urls]
Homepage = "https://github.com/xamresor/knowledge-index"
Documentation = "https://knowledge-index.sereda.lv"
Changelog = "https://github.com/xamresor/knowledge-index/blob/main/CHANGELOG.md"

[project.scripts]
kb = "knowledge_index.cli:kb"
kb-mcp = "knowledge_index.cli:kb_mcp"
kb-api = "knowledge_index.cli:kb_api"
kb-http = "knowledge_index.cli:kb_http"
kb-login = "knowledge_index.cli:kb_login"
kb-refresh = "knowledge_index.cli:kb_refresh"
kb-install = "knowledge_index.cli:kb_install"
kb-extract = "knowledge_index.cli:kb_extract"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"        # the VERSION file is the single source of truth

[tool.hatch.build.targets.wheel]
# The package is a launcher; the shipped scripts, the web shell and the config examples are data.
packages = ["knowledge_index"]
artifacts = ["VERSION"]
include = [
  "knowledge_index",
  "bin",
  "web",
  "contrib",
  "skills",
  "VERSION",
  "Makefile",
  "kb.projects.toml.example",
  "aliases.toml.example",
  "datadict.toml.example",
  "kb.hubs.txt",
  "sandbox/package.json",
  "sandbox/package-lock.json",
  "sandbox/runner.mjs",
  "sandbox/socket-server.mjs",
]
exclude = ["web/vendor", "sandbox/node_modules", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
bin = "bin"
web = "web"
contrib = "contrib"                  # the access plugin `kb addon install contrib/users` names
skills = "skills"                    # the how-to page offers them for download
VERSION = "VERSION"
"kb.projects.toml.example" = "kb.projects.toml.example"
"aliases.toml.example" = "aliases.toml.example"
"datadict.toml.example" = "datadict.toml.example"
"kb.hubs.txt" = "kb.hubs.txt"
"sandbox/package.json" = "sandbox/package.json"
"sandbox/package-lock.json" = "sandbox/package-lock.json"
"sandbox/runner.mjs" = "sandbox/runner.mjs"
"sandbox/socket-server.mjs" = "sandbox/socket-server.mjs"

[tool.hatch.build.targets.sdist]
include = ["bin", "web", "contrib", "tests", "knowledge_index", "VERSION", "Makefile", "README.md",
           "Dockerfile", ".dockerignore", "docker",
           "CHANGELOG.md", "LICENSE", "*.example", "kb.hubs.txt", "docs", "skills", "examples",
           "sandbox/package.json", "sandbox/package-lock.json", "sandbox/runner.mjs",
           "sandbox/socket-server.mjs"]
exclude = ["web/vendor", "graphify-out", "repos", ".docs", "sandbox/node_modules", "**/__pycache__"]
