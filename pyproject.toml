[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-index"
dynamic = ["version"]
description = "A read-only knowledge layer over related code projects: one cross-repo code graph plus on-device doc search, exposed to agents (MCP), scripts (HTTP) and a human (static dashboard)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"          # tomllib, used for the config and the alias table
authors = [{ name = "Romans Sereda" }]
keywords = ["code-graph", "knowledge-base", "mcp", "rag", "search", "graphify", "qmd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]

# No runtime Python dependencies — standard library only, on purpose: the tool has to run where
# installing packages is not an option. Its two real dependencies are external CLIs that no Python
# package manager can deliver (`graphify` via uv/pipx, `qmd` via npm); `kb-install` checks for them.
dependencies = []

[project.urls]
Homepage = "https://github.com/xamresor/knowledge-index"
Changelog = "https://github.com/xamresor/knowledge-index/blob/main/CHANGELOG.md"

[project.scripts]
kb = "knowledge_index.cli:kb"
kb-mcp = "knowledge_index.cli:kb_mcp"
kb-api = "knowledge_index.cli:kb_api"
kb-install = "knowledge_index.cli:kb_install"
kb-extract = "knowledge_index.cli:kb_extract"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"        # the VERSION file is the single source of truth

[tool.hatch.build.targets.wheel]
# The package is a launcher; the shipped scripts, the web shell and the config examples are data.
packages = ["knowledge_index"]
artifacts = ["VERSION"]
include = [
  "knowledge_index",
  "bin",
  "web",
  "VERSION",
  "Makefile",
  "kb.projects.toml.example",
  "aliases.toml.example",
  "kb.hubs.txt",
]
exclude = ["web/vendor", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
bin = "bin"
web = "web"
VERSION = "VERSION"
"kb.projects.toml.example" = "kb.projects.toml.example"
"aliases.toml.example" = "aliases.toml.example"
"kb.hubs.txt" = "kb.hubs.txt"

[tool.hatch.build.targets.sdist]
include = ["bin", "web", "tests", "knowledge_index", "VERSION", "Makefile", "README.md",
           "CHANGELOG.md", "LICENSE", "*.example", "kb.hubs.txt"]
exclude = ["web/vendor", "graphify-out", "repos", ".docs", "**/__pycache__"]
