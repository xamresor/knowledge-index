# nginx vhost for the shared KB MCP server. A template: replace kb.example.com with your host.
#   1. sudo certbot certonly --nginx -d kb.example.com
#   2. sudo cp nginx-kb.conf /etc/nginx/sites-available/kb.example.com
#   3. sudo ln -s /etc/nginx/sites-available/kb.example.com /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. curl -si https://kb.example.com/mcp -X POST   -> 401 with WWW-Authenticate
#
# kb-http checks the bearer token itself; nginx only terminates TLS and forwards.

server {
        listen 443 ssl http2;
        server_name kb.example.com;
        charset utf-8;

        client_max_body_size 1m;

        location = /mcp {
                proxy_pass http://127.0.0.1:8790;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_read_timeout 180s;
                proxy_send_timeout 180s;
        }

        location / {
                return 404;
        }

        ssl_certificate /etc/letsencrypt/live/kb.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;
}

server {
        listen 80;
        server_name kb.example.com;
        return 301 https://$host$request_uri;
}
